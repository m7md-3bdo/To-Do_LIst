<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>على القهوة النهارده</title>
        <link rel="stylesheet" href="Css/all.min.css">
        <link rel="stylesheet" href="Css/style.css">
        <link rel="stylesheet" href="Css/bootstrap.min.css">

    </head>

    <body class="ahwa">

        <!-- الشاشة كلها: شريط علوي + عمود المهام (الأساسي) + عمود جانبي -->
        <div class="app" id="slip">

            <!-- ===== الشريط العلوي: العنوان + التاريخ + الأدوات ===== -->
            <header class="top-bar">
                <div>
                    <h1 class="title">على القهوة النهارده</h1>
                    <p class="date-line" id="dateLine"></p>
                </div>
                <div class="toolbar d-flex gap-1">
                    <button id="waiterBtn" class="icon-btn" type="button" title="اطلب من الجرسون" aria-label="اطلب من الجرسون"><i class="fa-solid fa-bell-concierge"></i></button>
                    <button id="billBtn" class="icon-btn" type="button" title="الحساب" aria-label="الحساب"><i class="fa-solid fa-receipt"></i></button>
                    <button id="weekBtn" class="icon-btn" type="button" title="إحصائيات الأسبوع" aria-label="إحصائيات الأسبوع"><i class="fa-solid fa-chart-column"></i></button>
                    <details class="more" id="more">
                            <summary class="icon-btn" title="المزيد" aria-label="المزيد"><i class="fa-solid fa-ellipsis"></i></summary>
                            <div class="menu">
                                <button id="exportBtn" type="button"><i class="fa-solid fa-download"></i> حفظ نسخة</button>
                                <button id="importBtn" type="button"><i class="fa-solid fa-upload"></i> استيراد</button>
                                <button id="soundBtn" type="button"><i class="fa-solid fa-volume-high"></i> الصوت</button>
                                <button id="themeBtn" type="button"><i class="fa-solid fa-moon"></i> وضع ليلي</button>
                                <input id="importFile" type="file" accept=".json,application/json" hidden>
                            </div>
                        </details>
                </div>
            </header>

            <!-- ===== العمود الأساسي: الإضافة + الفلترة + قايمة المهام (جزء 1 و 2 و 3 و 4 و 6) ===== -->
            <main class="col-main">
                <section class="adder">
                    <div class="add-row d-flex gap-2">
                        <button id="catNow" class="cat-now" type="button"></button>
                        <input id="taskInput" class="task-input" type="text" maxlength="100" autocomplete="off"
                               placeholder="اكتب مهمة جديدة…" aria-label="مهمة جديدة">
                        <button id="addBtn" class="add-btn" type="button"><i class="fa-solid fa-plus"></i> إضافة</button>
                    </div>
                    <div class="opts">
                        <div class="cat-picker d-flex flex-wrap gap-2" id="catPicker" role="radiogroup" aria-label="تصنيف المهمة"></div>
                        <label class="due-field" title="ميعاد التسليم"><i class="fa-regular fa-clock"></i><input type="datetime-local" id="dueInput" aria-label="ميعاد التسليم"></label>
                        <div class="effort-picker d-flex gap-2" id="effortPicker" role="radiogroup" aria-label="مستوى المجهود"></div>
                    </div>
                    <p class="err" id="err" role="alert"></p>
                </section>

                <nav class="tabs d-flex gap-2" id="tabs" aria-label="فلترة المهام"></nav>
                <ul class="task-list" id="taskList"></ul>
                <p class="note" id="note"></p>
            </main>

            <!-- ===== العمود الجانبي: الكوباية + العداد + التركيز + التقارير (جزء 5) ===== -->
            <aside class="col-side">
                <section class="card cup-card">
                    <svg class="glass" viewBox="0 0 80 100" role="img" aria-label="كوباية شاي بتتملي مع إنجازك">
                        <defs>
                            <clipPath id="cupClip"><path d="M12 24 H68 L62 84 Q61 92 53 92 H27 Q19 92 18 84 Z"/></clipPath>
                        </defs>
                        <g class="steam" stroke="#6b8089" stroke-width="3" stroke-linecap="round" fill="none">
                            <path d="M30 18 q-5 -6 0 -12"/><path d="M42 18 q-5 -6 0 -12"/><path d="M54 18 q-5 -6 0 -12"/>
                        </g>
                        <g clip-path="url(#cupClip)">
                            <rect x="0" y="24" width="80" height="70" class="cup-bg"/>
                            <rect class="liquid" id="liquid" x="0" y="92" width="80" height="0" fill="#9a5a10"/>
                            <rect class="liquid" id="liquidTop" x="0" y="92" width="80" height="0" fill="#e3a21a" opacity=".55"/>
                        </g>
                        <path d="M12 24 H68 L62 84 Q61 92 53 92 H27 Q19 92 18 84 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M8 96 H72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <div class="stats">
                        <p class="count" id="count"></p>
                        <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></div>
                        <p class="pct" id="pct"></p>
                        <p class="mini-stats">
                            <span><i class="fa-solid fa-fire"></i> <span id="streakTxt"></span></span>
                            <span><i class="fa-solid fa-mug-hot"></i> <span id="cupsTxt"></span></span>
                        </p>
                    </div>
                </section>

                <section class="card due-card">
                    <h2 class="side-h"><i class="fa-regular fa-clock"></i> المواعيد القريبة</h2>
                    <ul class="due-list" id="dueList"></ul>
                </section>

                <!-- بانل التركيز: بتظهر لما تدوس على ساعة التوقيت في أي مهمة -->
                <section class="focus" id="focus">
                    <div class="d-flex align-items-center gap-3">
                        <i class="fa-solid fa-mug-hot"></i>
                        <div class="f-info"><small>بتركّز على</small><strong id="focusTitle"></strong></div>
                        <span class="f-time" id="focusTime">25:00</span>
                        <button id="focusStop" class="icon-btn" type="button" aria-label="إيقاف"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="bar"><i id="focusFill"></i></div>
                </section>

                <section class="report" id="report">
                    <button id="reportClose" class="icon-btn" type="button" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
                    <div id="reportBody"></div>
                </section>
            </aside>
        </div>

        <!-- رسالة التراجع وكلام الجرسون -->
        <div class="toast-box" id="toast" role="status"></div>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/features.js"></script>
        <script src="js/extras.js"></script>
        <script src="js/main.js"></script>
    </body>

</html>
