<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>على القهوة النهارده</title>
        <link rel="stylesheet" href="Css/all.min.css">
        <link rel="stylesheet" href="Css/style.css">
        <link rel="stylesheet" href="Css/bootstrap.min.css">

    </head>

    <body class="ahwa">

        <!-- ========== الغلاف العام (بوتستراب container) ========== -->
        <div class="container py-4">

            <!-- الفاتورة: الكارت الأساسي اللي فيه التطبيق كله -->
            <main class="slip" id="slip">

                <!-- قائمة الإعدادات: الأدوات اللي مش بتتستخدم كل يوم -->
                <div class="menu-wrap">
                    <button id="menuBtn" class="icon-btn" type="button" title="الإعدادات" aria-label="الإعدادات" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-gear"></i></button>
                    <div class="menu" id="menu" hidden>
                        <button id="billBtn" class="menu-item" type="button"><i class="fa-solid fa-receipt"></i> الحساب</button>
                        <button id="weekBtn" class="menu-item" type="button"><i class="fa-solid fa-chart-column"></i> الأسبوع</button>
                        <div class="menu-sep" role="separator"></div>
                        <button id="exportBtn" class="menu-item" type="button"><i class="fa-solid fa-download"></i> حفظ نسخة</button>
                        <button id="importBtn" class="menu-item" type="button"><i class="fa-solid fa-upload"></i> استيراد</button>
                        <div class="menu-sep" role="separator"></div>
                        <button id="soundBtn" class="menu-item" type="button"><i class="fa-solid fa-volume-high"></i> صوت الشطب</button>
                        <button id="themeBtn" class="menu-item" type="button"><i class="fa-solid fa-moon"></i> الوضع الليلي</button>
                        <input id="importFile" type="file" accept=".json,application/json" hidden>
                    </div>
                </div>

                <!-- ===== جزء 5: الهيدر + العداد + نسبة الإنجاز + كوباية الشاي ===== -->
                <header class="top d-flex align-items-center gap-3">
                    <svg class="glass" viewBox="0 0 80 100" role="img" aria-label="كوباية شاي بتتملي مع إنجازك">
                        <defs>
                            <clipPath id="cupClip"><path d="M12 24 H68 L62 84 Q61 92 53 92 H27 Q19 92 18 84 Z"/></clipPath>
                        </defs>
                        <g class="steam" stroke="#6b8089" stroke-width="3" stroke-linecap="round" fill="none">
                            <path d="M30 18 q-5 -6 0 -12"/><path d="M42 18 q-5 -6 0 -12"/><path d="M54 18 q-5 -6 0 -12"/>
                        </g>
                        <g clip-path="url(#cupClip)">
                            <rect x="0" y="24" width="80" height="70" class="cup-bg"/>
                            <rect class="liquid" id="liquid" x="0" y="92" width="80" height="0" fill="#9a5a10"/>
                            <rect class="liquid" id="liquidTop" x="0" y="92" width="80" height="0" fill="#e3a21a" opacity=".55"/>
                        </g>
                        <path d="M12 24 H68 L62 84 Q61 92 53 92 H27 Q19 92 18 84 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M8 96 H72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    </svg>

                    <div class="stats">
                        <p class="date-line" id="dateLine"></p>
                        <h1 class="title">على القهوة النهارده</h1>
                        <p class="count" id="count"></p>
                        <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <i id="barFill"></i>
                        </div>
                        <div class="meta">
                            <span class="meta-item" id="streakBox" hidden><i class="fa-solid fa-fire"></i> <span id="streakTxt"></span></span>
                            <span class="meta-item" id="cupsBox" hidden><i class="fa-solid fa-mug-hot"></i> <span id="cupsTxt"></span></span>
                            <button id="waiterBtn" class="link-btn" type="button" title="الجرسون يرشّحلك مهمة تبدأ بيها" hidden><i class="fa-solid fa-bell-concierge"></i> مش عارف تبدأ بإيه؟</button>
                        </div>
                    </div>
                </header>

                <section class="report" id="report">
                    <button id="reportClose" class="icon-btn" type="button" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
                    <div id="reportBody"></div>
                </section>

                <!-- بانل التركيز: بتظهر لما تدوس على ساعة التوقيت في أي مهمة -->
                <section class="focus" id="focus">
                    <div class="d-flex align-items-center gap-3">
                        <i class="fa-solid fa-mug-hot"></i>
                        <div class="f-info"><small>بتركّز على</small><strong id="focusTitle"></strong></div>
                        <span class="f-time" id="focusTime">25:00</span>
                        <button id="focusStop" class="icon-btn" type="button" aria-label="إيقاف"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="bar"><i id="focusFill"></i></div>
                </section>

                <!-- ===== جزء 1: إضافة مهمة (التصنيف + الـ Input + زرار Add) ===== -->
                <section class="adder" id="adder">
                    <div class="add-row d-flex gap-2">
                        <input id="taskInput" class="task-input" type="text" maxlength="100" autocomplete="off"
                               placeholder="اكتب مهمة جديدة…" aria-label="مهمة جديدة">
                        <button id="addBtn" class="add-btn" type="button">
                            <i class="fa-solid fa-plus"></i> إضافة
                        </button>
                    </div>
                    <!-- التصنيف والمجهود: بيظهروا لما تضغط على الخانة -->
                    <div class="add-opts">
                        <div class="add-opts-in">
                            <div class="add-opts-row">
                                <select id="catSelect" class="cat-select" aria-label="تصنيف المهمة"></select>
                                <span id="effortPicker"></span>
                            </div>
                        </div>
                    </div>
                    <p class="err" id="err" role="alert"></p>
                </section>

                <!-- ===== جزء 6: تابات الفلترة حسب التصنيف ===== -->
                <nav class="tabs d-flex gap-2" id="tabs" aria-label="فلترة المهام"></nav>

                <!-- ===== جزء 2/3/4: قائمة المهام (عرض + شطب + تعديل + حذف) ===== -->
                <ul class="task-list" id="taskList"></ul>

                <p class="note" id="note"></p>

            </main>

            <!-- رسالة التراجع وكلام الجرسون -->
            <div class="toast-box" id="toast" role="status"></div>
        </div>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/features.js"></script>
        <script src="js/extras.js"></script>
        <script src="js/main.js"></script>
    </body>

</html>
